# Fly.io production config for ShineW Pride Backend.
# Docs: https://fly.io/docs/reference/configuration/
#
# First-time setup:
#   fly launch --no-deploy --copy-config
#   fly postgres create   # or attach Neon/Supabase via DATABASE_URL secret
#   fly secrets set DATABASE_URL="..." SHOPIFY_API_KEY="..." SHOPIFY_API_SECRET="..." \
#     SHOPIFY_APP_URL="https://<app-name>.fly.dev" SCOPES="read_products,write_products,read_customers,write_customers,write_app_proxy" \
#     RESEND_API_KEY="..." RESEND_FROM_EMAIL="..." WATERMARK_TEXT="ShineW Pride"
#   fly deploy
#   cd shinewpride-app && npm run deploy   # Shopify CLI — registers webhooks & updates app URL
#
# Scale (keep exactly 1 worker for cron + BullMQ consumers):
#   fly scale count web=1 worker=1
# Set REDIS_URL secret for BullMQ retry workers (Upstash/Fly Redis).

app = "shinewpride-app"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  EMAIL_SCHEDULER_TIMEZONE = "Asia/Ho_Chi_Minh"
  WATERMARK_TEXT = "ShineW Pride"

[deploy]
  release_command = "npx prisma migrate deploy"

[processes]
  web = "npm run docker-start:web"
  worker = "npm run docker-start:worker"

[[services]]
  processes = ["web"]
  internal_port = 3000
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [services.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 40

  [[services.http_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "20s"
    method = "GET"
    path = "/"
    protocol = "http"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
