services:
  postgres:
    image: postgres:16-alpine
    container_name: shinewpride-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: shinewpride
      POSTGRES_PASSWORD: shinewpride_dev
      POSTGRES_DB: shinewpride
    volumes:
      - shinewpride_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shinewpride -d shinewpride"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  shinewpride_pgdata:
